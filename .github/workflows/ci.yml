name: CI

# GitHub Actions minutes cost money on a private repo, so this no longer
# fires automatically on every push/PR — `npm run verify` locally before
# pushing is the enforced gate instead (see README). Kept as a manual
# workflow for the rare case a run in a clean CI environment is useful.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
